[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-infra"
version = "0.1.0"
description = "Runtime infrastructure for embodied multi-agent systems: event tracing, world memory, supervision and intervention."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=5.4",
]

[tool.setuptools.packages.find]
include = ["embodied_infra*"]
